<!-- Jac Model Studio mark. Deliberately minimal, to match the app's chrome: the
     only branding anywhere is the mono/uppercase "JAC · MODEL STUDIO" wordmark
     (components/jms/Landing.cl.jac:97), so there is no logo to shrink down.
     Instead: the accent orange (the `accent` token, theme.css:28) as a solid
     rounded square, carrying a "J" drawn as a stroked path in the same
     near-black the app puts on accent buttons (`accent-foreground`,
     theme.css:66). The J is a path, not <text>, because favicon renderers do
     not load webfonts and would substitute an arbitrary system face.

     NOTE: no "‑‑" (double hyphen) may appear in this comment; that is illegal
     inside an XML comment and an SVG must be well-formed XML or the browser
     silently renders nothing. This is why the CSS custom properties above are
     named without their leading dashes.

     This file is the source of truth. favicon.ico beside it is a derived raster
     (16/32/48/64 px) of the same artwork, and exists only because the dev-mode
     index.html is generated by jac-client with a hardcoded <head> that has no
     <link rel="icon"> hook, so in dev the browser can only ever ask for the
     bare /favicon.ico. Change the artwork here, then re-render the .ico with
     any SVG to ICO converter. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#EC8242"/>
  <path d="M21 8.5 L21 18.5 A5 5 0 0 1 11 18.5"
        fill="none" stroke="#2B1608" stroke-width="3.4" stroke-linecap="round"/>
</svg>
