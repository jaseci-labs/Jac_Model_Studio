# studio.workspace.toml — JMS data-config. The ONLY place that names external
# artifacts (model dirs, datasets). Edit it to point JMS at a checkout; no code
# changes. Every path here may be missing: the app still boots, the model shows
# as unavailable and dataset files count 0.
#
# Resolution (see workspace.sv.jac / paths.sv.jac):
#   file:  $JAC_STUDIO_WORKSPACE/studio.workspace.toml, else ./studio.workspace.toml
#   paths: relative paths resolve against $JAC_STUDIO_WORKSPACE (default: repo root);
#          absolute paths are used as-is.
# Defaults below assume the experiments repo checked out next to this repo (../model-experiments).

# ---------------------------------------------------------------------------
# Model registry (models.sv.jac) — the chat / train / plan model pickers.
# `path` = MLX model dir; optional `adapter` = LoRA adapter dir loaded on top
# (adapter entries are chat/plan/eval-only; JMS training needs a plain base).
# The first entry is the default model for new workspaces.
# ---------------------------------------------------------------------------

[models]
# per-user results/ subdirs that are reserved (never used as a cloud-run name)
excluded_run_dirs = ["comparison", "_builder", "_evals"]

[[models.registry]]
id = "qwen-q4"
label = "Qwen3-Coder · BASE (q4)"
path = "../model-experiments/models/qwen-q4"

[[models.registry]]
id = "qwen-08-spectrum-sft"
label = "Qwen3-Coder · 08 SFT (spectrum)"
path = "../model-experiments/models/qwen-q4"
adapter = "../model-experiments/08-nitin-new2-ds/spectrum_probe/adapters/sft-on-nitin-spectrum"

# Archived best adapters (model-experiments/archive/README.md)
[[models.registry]]
id = "qwen-04-spectrum-sft"
label = "Qwen3-Coder · 04 SFT (spectrum, 74.7%)"
path = "../model-experiments/models/qwen-q4"
adapter = "../model-experiments/archive/04-cpt-sft"

[[models.registry]]
id = "qwen-06-spectrum-sft"
label = "Qwen3-Coder · 06 SFT (spectrum, 74.4%)"
path = "../model-experiments/models/qwen-q4"
adapter = "../model-experiments/archive/06-nitin-ds-sft"

[[models.registry]]
id = "qwen-07-spectrum-dpo"
label = "Qwen3-Coder · 07 DPO-best (spectrum, 73.0%)"
path = "../model-experiments/models/qwen-q4"
adapter = "../model-experiments/archive/07-nitin-ds-new-sft"

# ---------------------------------------------------------------------------
# Dataset browser (data.sv.jac, experiments DATA section)
# ---------------------------------------------------------------------------

[data]
# browsable files as [path, human label]
preview_files = [
  ["../model-experiments/08-nitin-new2-ds/dataset/sft/train.jsonl", "08 SFT train"],
  ["../model-experiments/08-nitin-new2-ds/dataset/sft/valid.jsonl", "08 SFT valid"],
  ["../model-experiments/08-nitin-new2-ds/dataset/dpo/train.jsonl", "08 DPO train"],
  ["../model-experiments/08-nitin-new2-ds/dataset/dpo/valid.jsonl", "08 DPO valid"]
]
# counted into the SFT.TOTAL tile
sft_stat_files = [
  "../model-experiments/08-nitin-new2-ds/dataset/sft/train.jsonl",
  "../model-experiments/08-nitin-new2-ds/dataset/sft/valid.jsonl"
]

# one stat tile per named split (name -> path)
[data.split_files]
sft_train = "../model-experiments/08-nitin-new2-ds/dataset/sft/train.jsonl"
sft_valid = "../model-experiments/08-nitin-new2-ds/dataset/sft/valid.jsonl"
dpo_train = "../model-experiments/08-nitin-new2-ds/dataset/dpo/train.jsonl"
dpo_valid = "../model-experiments/08-nitin-new2-ds/dataset/dpo/valid.jsonl"

# ---------------------------------------------------------------------------
# Training backends (backends.sv.jac) — declarative job specs → shell commands.
# Only the remote GPU backend is wired (cloudruns.sv.jac). Local MLX training
# lives in the JMS surface (jms_train.sv.jac) and needs no template.
# ---------------------------------------------------------------------------

[backends]
default = "spheron_gpu"

[backends.spheron_gpu]
label = "Remote GPU (BYO cluster)"
description = "remote/train_sft.py on a GPU box, orchestrated by remote/supervisor.py"

# Runs inside <remote_dir> on the VM after bootstrap.sh built .venv and the
# supervisor uploaded data/train.jsonl + data/valid.jsonl + train_sft.py.
# {base_model} / {extra_flags} are filled by cloudruns.sv.jac (opts become CLI
# flags — env vars don't cross the ssh launch, so env_keys stays empty).
[backends.spheron_gpu.sft]
template = ".venv/bin/python train_sft.py --model_name_or_path {base_model} --dataset data/train.jsonl --eval_dataset data/valid.jsonl --output_dir output --metrics_file metrics.jsonl{extra_flags}"
cwd = "data"
env_keys = []
log_parser = "mlx"

# ---------------------------------------------------------------------------
# Supervised cloud runs (cloudruns.sv.jac + remote/supervisor.py): default
# dataset uploaded to the box, remote dir base, supervisor policy defaults.
# ---------------------------------------------------------------------------

[cloudrun]
train_rel = "../model-experiments/08-nitin-new2-ds/dataset/sft/train.jsonl"
valid_rel = "../model-experiments/08-nitin-new2-ds/dataset/sft/valid.jsonl"
remote_dir = "studio-run"
auto_terminate = "on_success"
max_wall_clock_min = 720
ssh_wait_timeout_s = 900
provision_timeout_s = 1800
stall_timeout_min = 30
poll_interval_s = 10
